# ============================================================================
# Auto-format PR branches with ruff
# ============================================================================
#
# Separated from CI to avoid granting contents:write to the reusable
# CI workflow (which is also called by the release pipeline).
#
# Security notes:
#   - persist-credentials: false prevents token leakage to later steps
#   - Token is only used explicitly in the push step via remote URL
#   - Only stages profinet/ files (not git add -A) to prevent unintended commits
#   - Only runs on pull_request events
#
# ============================================================================

name: Auto-format

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  format:
    name: Auto-format (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          pip install --only-binary=:all: "ruff>=0.15.0"

      - name: Run ruff format
        run: ruff format profinet/

      - name: Commit and push formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add profinet/
          git diff --staged --quiet || git commit -m "style: auto-format with ruff"
          git push
